services:
  db:
    image: postgres:16-alpine
    container_name: mejor-ubicacion-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mejor
      POSTGRES_PASSWORD: mejor
      POSTGRES_DB: mejor_ubicacion
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mejor -d mejor_ubicacion"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: mejor-ubicacion-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mejor:mejor@db:5432/mejor_ubicacion?schema=public
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  app_node_modules:
